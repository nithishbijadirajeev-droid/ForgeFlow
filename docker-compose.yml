version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: forgeflow-postgres
    restart: always

    environment:
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: forgeflow123
      POSTGRES_DB: forgeflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  forgeflow:
    build:
      context: .
      dockerfile: app/Dockerfile

    container_name: forgeflow-api

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SERVER_PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: forgeflow
      DB_PASSWORD: forgeflow123
      DB_NAME: forgeflow
      DB_SSLMODE: disable

    ports:
      - "8080:8080"

volumes:
  postgres_data: